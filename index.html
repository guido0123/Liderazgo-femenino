<script>
// Dominios del programa de Liderazgo Femenino
const DOMINIOS = [
  { id: 'identidad', name: 'Identidad y Herencia', desc: 'Desmantelamiento de moldes heredados y consolidación de un estilo auténtico.' },

// 24 Afirmaciones
const AFIRMACIONES_INICIALES = [
  { id: 1, domain: 'identidad', text: 'Cuestiono los modelos de autoridad tradicionales y defino mi propio estilo de liderazgo.' },

const CASOS_ESTUDIO = [

async function consultarCoach(moduloNombre,actividadNombre,respuestasTexto,extra,signal){
  const payload={modulo:moduloNombre,actividad:actividadNombre,userInput:respuestasTexto||'',userScores:leerPuntajes(),...(extra||{})};
  const res=await fetch(COACH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});
  let data=null;try{data=await res.json()}catch(x){}
  if(!res.ok)throw new Error((data&&(data.error||data.message))||'El servidor del Coach respondió con error '+res.status+'.');

  return String(t);
}
